# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für dieses Kapitel
description: "Zahlen vergleichen und ordnen, Brüche und Dezimalzahlen: was du für die Umfrage der Klasse 6a schon können solltest."
recap: [mathematik/zahlen-vergleichen-ordnen, mathematik/brueche-begriff, mathematik/dezimalbrueche-rechnen]
scope: |
  Diese Seite wiederholt, was das Kapitel voraussetzt: natürliche Zahlen vergleichen und der Größe nach ordnen, Brüche als
  Teil eines Ganzen deuten (Zähler über Nenner) und mit Dezimalzahlen rechnen. Jeder Abschnitt hat einen Kurztest. Wer einen
  Kurztest nicht sicher beantwortet, schaut sich den Baustein auf der Lernlandkarte an.
blocks:
  - type: section
    id: einstieg
    title: Kannst du das schon?
    blocks:
      - type: text
        text: |
          Dieses Kapitel braucht drei Dinge: Zahlen vergleichen und ordnen, Brüche und Dezimalzahlen. Für Tabellen und Diagramme brauchst du das Ordnen von Zahlen, für Häufigkeiten Brüche und für den Mittelwert das Rechnen mit Dezimalzahlen. Zu jedem gibt es eine
          kurze Wiederholung und einen Kurztest. Am Ende steht eine Checkliste.
  - type: section
    id: zahlen
    title: Zahlen vergleichen und ordnen
    blocks:
      - type: text
        text: |
          Ich kann natürliche Zahlen vergleichen, am Zahlenstrahl ablesen und der Größe nach ordnen. Beim **Vergleichen**
          sagst du, welche Zahl größer ist. Beim **Ordnen** stellst du Zahlen der Größe nach hintereinander.
      - type: definition
        term: Natürliche Zahlen
        explanation: Die natürlichen Zahlen sind die Zahlen zum Zählen, also 0, 1, 2, 3 und immer so weiter.
      - type: definition
        term: Zahlenstrahl
        explanation: Der Zahlenstrahl beginnt bei 0 und geht nach rechts. Je weiter rechts eine Zahl liegt, desto größer ist sie. Zum Beispiel liegt 3 links von 7, also ist 3 kleiner als 7.
      - type: figure
        image: images/zahlenstrahl-0-10.svg
        alt: Zahlenstrahl von 0 bis 10 mit den markierten Zahlen 3 und 7. Die 7 liegt weiter rechts.
        caption: Schau, welche Markierung weiter rechts liegt.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Stellenwert
        explanation: Der Stellenwert sagt, was eine Ziffer in einer Zahl wert ist. In 385 steht die 3 für 3 Hunderter, die 8 für 8 Zehner und die 5 für 5 Einer.
      - type: example
        title: Zwei Zahlen vergleichen
        blocks:
          - type: text
            text: "Welche Zahl ist größer, 385 oder 358? Vergleiche von links: Beide haben 3 Hunderter, 385 hat 8 Zehner, 358 hat 5 Zehner. Also ist 385 größer als 358."
      - type: vue-component
        id: test-zahlen
        component: Kurztest
        props:
          question: "Welche dieser Zahlen ist die größte?"
          options:
            - {
                text: "45 007",
                correct: true,
                info: "Sie hat 4 Zehntausender und 5 Tausender. Die anderen haben nur 0 Tausender.",
              }
            - {
                text: "40 570",
                correct: false,
                info: "Sie hat 0 Tausender. 45 007 hat 5 Tausender und ist deshalb größer.",
              }
            - {
                text: "40 705",
                correct: false,
                info: "Sie hat 0 Tausender. 45 007 hat 5 Tausender und ist deshalb größer.",
              }
            - {
                text: "40 075",
                correct: false,
                info: "Sie hat 0 Tausender und 0 Hunderter. Sie ist die kleinste der vier Zahlen.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welche Zahl ist die größte, 45 007, 40 570, 40 705 oder 40 075? Antwort: 45 007, denn sie hat als einzige 5 Tausender.
      - type: vue-component
        id: test-ordnen
        component: Kurztest
        props:
          question: "Welche Reihe ist der Größe nach geordnet, die kleinste Zahl zuerst?"
          options:
            - {
                text: "3 099, 3 190, 3 910, 9 013",
                correct: true,
                info: "Die Zahlen steigen von links nach rechts: erst 3 Tausender mit wenigen Hundertern, dann mehr Hunderter, zuletzt 9 Tausender.",
              }
            - {
                text: "3 190, 3 099, 3 910, 9 013",
                correct: false,
                info: "3 099 ist kleiner als 3 190: Bei gleichen Tausendern entscheiden die Hunderter, 0 ist weniger als 1.",
              }
            - {
                text: "9 013, 3 910, 3 190, 3 099",
                correct: false,
                info: "Das ist von groß nach klein geordnet. Gefragt ist die kleinste Zahl zuerst.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welche Reihe ist der Größe nach geordnet, die kleinste Zahl zuerst? Antwort: 3 099, 3 190, 3 910, 9 013.
      - type: text
        text: Wenn du nicht sicher warst, schau dir den Baustein „Zahlen vergleichen und ordnen“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/zahlen-vergleichen-ordnen/) an.
  - type: section
    id: brueche
    title: Der Bruchbegriff
    blocks:
      - type: text
        text: |
          Ich kann Brüche als Teil eines Ganzen deuten und darstellen. Ein **Bruch** beschreibt einen Teil eines Ganzen, das in
          gleich große Teile geteilt ist. Der **Nenner** sagt, in wie viele gleiche Teile das Ganze geteilt ist. Der **Zähler**
          sagt, wie viele dieser Teile gemeint sind.
      - type: definition
        term: Bruch
        explanation: Ein Bruch wie $\frac{3}{4}$ beschreibt einen Teil eines Ganzen. Der Nenner 4 sagt, dass das Ganze in vier gleiche Teile geteilt ist, der Zähler 3, dass drei davon gemeint sind.
      - type: definition
        term: Nenner
        explanation: Der Nenner steht unter dem Bruchstrich. Er sagt, in wie viele gleich große Teile das Ganze geteilt ist, bei $\frac{3}{4}$ in vier Teile.
      - type: definition
        term: Zähler
        explanation: Der Zähler steht über dem Bruchstrich. Er sagt, wie viele dieser Teile gemeint sind, bei $\frac{3}{4}$ drei Teile.
      - type: figure
        image: images/rechteck-drei-viertel.svg
        alt: Ein Rechteck in vier gleich große Teile geteilt. Drei Teile sind gefärbt, einer ist weiß.
        caption: Das ganze Rechteck ist das Ganze. Drei von vier gleich großen Teilen sind gefärbt.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: example
        title: Ein Bruch am Rechteck
        blocks:
          - type: text
            text: Das Rechteck ist in 4 gleiche Teile geteilt, 3 sind gefärbt. Der Bruch heißt $\frac{3}{4}$, gesprochen drei Viertel.
      - type: vue-component
        id: test-bruch
        component: Kurztest
        props:
          question: "Eine Pizza ist in 12 gleich große Stücke geteilt. Jonas isst 5 Stücke, Mira isst 3 Stücke. Welchen Bruchteil der Pizza haben beide zusammen gegessen?"
          options:
            - {
                text: "acht Zwölftel",
                correct: true,
                info: "Zusammen sind es 5 + 3 = 8 Stücke. Der Nenner bleibt 12, denn die Pizza ist in 12 Teile geteilt.",
              }
            - {
                text: "acht Vierundzwanzigstel",
                correct: false,
                info: "Du hast die Nenner addiert. Das Ganze ist aber weiter in 12 Teile geteilt, also bleibt der Nenner 12.",
              }
            - {
                text: "zwei Zwölftel",
                correct: false,
                info: "Das ist der Unterschied zwischen 5 und 3. Gefragt ist, was beide zusammen gegessen haben.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Eine Pizza ist in 12 gleich große Stücke geteilt, Jonas isst 5 Stücke und Mira 3 Stücke. Antwort: acht Zwölftel, denn es sind 5 + 3 = 8 Stücke von 12.
      - type: text
        text: Wenn du nicht sicher warst, schau dir den Baustein „Bruchbegriff“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/brueche-begriff/) an.
  - type: section
    id: dezimal
    title: Rechnen mit Dezimalbrüchen
    blocks:
      - type: text
        text: |
          Ich kann mit Dezimalbrüchen rechnen. Eine **Dezimalzahl** hat ein Komma; man nennt sie auch **Dezimalbruch**. Die Stellen hinter dem Komma sind Zehntel,
          Hundertstel und so weiter. Beim Addieren schreibst du Komma unter Komma, beim Teilen rechnest du wie mit
          ganzen Zahlen und machst Zehntel und Hundertstel, wenn ein Rest bleibt (siehe Beispiel).
      - type: definition
        term: Dezimalzahl
        explanation: Eine Dezimalzahl wie 3,25 hat ein Komma. Die erste Stelle nach dem Komma sind Zehntel, die zweite Hundertstel. 3,25 ist 3 Ganze, 2 Zehntel und 5 Hundertstel.
      - type: example
        title: Mit Dezimalzahlen rechnen
        blocks:
          - type: text
            text: |
              Addieren: 3,5 + 1,25. Schreibe 3,50 + 1,25 = 4,75.

              Teilen: 35 : 4. 35 : 4 = 8 Rest 3, dann 3 Ganze sind 30 Zehntel, 30 : 4 = 7 Rest 2, dann 20 Hundertstel, 20 : 4 = 5. Also 35 : 4 = 8,75.
      - type: vue-component
        id: test-dezimal
        component: Kurztest
        props:
          question: "Wie viel ist 3,75 + 2,8?"
          options:
            - {
                text: "6,55",
                correct: true,
                info: "Schreibe 3,75 + 2,80 untereinander: Hundertstel 5, Zehntel 7 + 8 = 15, also 5 und ein Übertrag, Ganze 3 + 2 + 1 = 6.",
              }
            - {
                text: "5,83",
                correct: false,
                info: "Du hast die 8 wie 8 Hundertstel gerechnet. 2,8 sind 8 Zehntel, also 2,80.",
              }
            - {
                text: "6,5",
                correct: false,
                info: "Die 5 Hundertstel von 3,75 fehlen in deinem Ergebnis. Rechne 3,75 + 2,80.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie viel ist 3,75 + 2,8? Antwort: 6,55, denn 3,75 + 2,80 ergibt 5 Hundertstel, 15 Zehntel (also 5 Zehntel und einen Übertrag) und 6 Ganze.
      - type: text
        text: Wenn du nicht sicher warst, schau dir den Baustein „Rechnen mit Dezimalbrüchen“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/dezimalbrueche-rechnen/) an.
  - type: section
    id: checkliste
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - natürliche Zahlen vergleichen, am Zahlenstrahl ablesen und der Größe nach ordnen kannst,
          - Brüche als Teil eines Ganzen deuten und darstellen kannst,
          - mit Dezimalbrüchen rechnen kannst.

          Bei einem Punkt unsicher? Lies den Abschnitt oben noch einmal und schau dir den Baustein auf der Lernlandkarte an (Link unter dem Kurztest). Sonst geht es mit der Umfrage der Klasse 6a weiter.
